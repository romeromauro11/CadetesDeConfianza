<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadetes de Confianza — San Nicolás de los Arroyos</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ══ ENCABEZADO ══════════════════════════════════════════ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-icon">📦</span>
        <div>
          <h1 class="logo-title">Cadetes de Confianza</h1>
          <p class="logo-sub">San Nicolás de los Arroyos</p>
        </div>
      </div>
      <div class="header-clock" id="reloj"></div>
    </div>
  </header>

  <!-- ══ FILTROS ══════════════════════════════════════════════ -->
  <section class="filtros-bar">
    <div class="filtros-inner">

      <div class="filtro-grupo">
        <label class="filtro-label">Zona</label>
        <select id="filtro-zona" class="filtro-select">
          <option value="">Todas las zonas</option>
        </select>
      </div>

      <div class="filtro-grupo">
        <label class="filtro-label">Vehículo</label>
        <select id="filtro-vehiculo" class="filtro-select">
          <option value="">Todos los vehículos</option>
          <option value="moto">🛵 Moto</option>
          <option value="auto">🚗 Auto</option>
          <option value="bicicleta">🚲 Bicicleta</option>
          <option value="camioneta">🚐 Camioneta</option>
          <option value="utilitario">🚚 Utilitario</option>
        </select>
      </div>

      <div class="filtro-grupo filtro-toggle">
        <label class="toggle-label" for="filtro-disponibles">
          <input type="checkbox" id="filtro-disponibles" />
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          Solo disponibles ahora
        </label>
      </div>

      <button class="btn-limpiar" id="btn-limpiar">Limpiar filtros</button>
    </div>
  </section>

  <!-- ══ CONTADOR ════════════════════════════════════════════ -->
  <div class="resultado-info">
    <span id="contador-resultado"></span>
  </div>

  <!-- ══ GRILLA DE TARJETAS ══════════════════════════════════ -->
  <main class="grilla" id="grilla"></main>

  <!-- ══ TEMPLATE DE TARJETA (clonado por JS) ═══════════════ -->
  <template id="tpl-tarjeta">
    <article class="tarjeta">
      <div class="tarjeta-estado-badge"></div>
      <div class="tarjeta-foto-wrap">
        <img class="tarjeta-foto" src="" alt="" loading="lazy" />
        <div class="tarjeta-foto-placeholder">👤</div>
      </div>
      <div class="tarjeta-cuerpo">
        <h2 class="tarjeta-nombre"></h2>
        <div class="tarjeta-vehiculos"></div>
        <div class="tarjeta-horario-wrap">
          <span class="tarjeta-horario-icono">🕐</span>
          <span class="tarjeta-horario-texto"></span>
          <span class="tarjeta-estado-texto"></span>
        </div>
        <div class="tarjeta-tarifa-wrap">
          <span class="tarjeta-tarifa-icono">💲</span>
          <span class="tarjeta-tarifa-texto"></span>
        </div>
        <div class="tarjeta-zonas-seccion">
          <p class="tarjeta-zonas-titulo">✅ Zonas que cubre</p>
          <div class="tarjeta-zonas-si"></div>
        </div>
        <div class="tarjeta-zonas-no-seccion" style="display:none">
          <p class="tarjeta-zonas-titulo zonas-no-titulo">🚫 No va a</p>
          <div class="tarjeta-zonas-no"></div>
        </div>
        <p class="tarjeta-extra"></p>
        <a class="btn-whatsapp" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Contactar por WhatsApp
        </a>
      </div>
    </article>
  </template>

  <footer class="site-footer">
    <p>Directorio de cadetes locales · San Nicolás de los Arroyos · <span id="anio-footer"></span></p>
  </footer>

  <script src="cadetes.js"></script>
  <script src="app.js"></script>
</body>
</html>
